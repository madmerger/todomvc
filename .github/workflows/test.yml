name: test

on:
  pull_request:
  push:
    branches: [master]

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/javascript-es6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/javascript-es6/package-lock.json
      - run: npm ci
      - run: npm run coverage
      - run: npm run build

  unit-react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/react/package-lock.json
      - run: npm ci
      - run: npm run coverage
      - run: npm run build
